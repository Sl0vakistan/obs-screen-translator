<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OBS Screen Translator overlay</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
#canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.item { position: absolute; box-sizing: border-box; display: flex; align-items: center; border-radius: 4px;
  color: #fff; font-family: "Segoe UI", Arial, sans-serif; font-weight: 600; line-height: 1.18; opacity: 0;
  transition: opacity .12s, transform .25s linear; }
.item.on { opacity: 1; }
</style>
</head>
<body>
<div id="canvas"></div>
<script>
(function () {
  var query = new URLSearchParams(location.search), canvas = document.getElementById('canvas'), elements = {};
  var address = query.get('ws') || 'ws://127.0.0.1:8777', mine = parseInt(query.get('overlay') || '0', 10);
  var plain = {font: 'Segoe UI Semibold', size: 0, bold: false, italic: false, color: '#ffffff', background: '#000000',
               opacity: 0.85, outline: 0, outline_color: '#000000', align: 'auto', padding: 8, shadow: 0, shadow_strength: 0.5};
  document.documentElement.style.zoom = parseFloat(query.get('scale')) || 1;
  function rgba(hex, alpha) {
    var v = parseInt(hex.slice(1), 16);
    return 'rgba(' + (v >> 16 & 255) + ', ' + (v >> 8 & 255) + ', ' + (v & 255) + ', ' + alpha + ')';
  }
  function outline(width, color) {
    var shadows = [];
    for (var i = 0; i < 16; i++)
      shadows.push((Math.cos(i * Math.PI / 8) * width).toFixed(2) + 'px ' + (Math.sin(i * Math.PI / 8) * width).toFixed(2) + 'px 0 ' + color);
    return shadows;
  }
  // A soft shadow in the background colour that follows the letters, without edges; its size is in pixels. Up to half the
  // intensity one layer gets more opaque, above that a second layer is added, so 100 % is about twice as dark as 50 %.
  function glow(size, hex, strength) {
    var shadows = [];
    [Math.min(1, 2 * strength), Math.max(0, 2 * strength - 1)].forEach(function (alpha) {
      if (alpha <= 0) return;
      var color = rgba(hex, alpha);
      for (var i = 0; i < 8; i++)
        shadows.push((Math.cos(i * Math.PI / 4) * size / 2).toFixed(1) + 'px ' + (Math.sin(i * Math.PI / 4) * size / 2).toFixed(1) + 'px ' + size + 'px ' + color);
      shadows.push('0 0 ' + 2 * size + 'px ' + color);
    });
    return shadows;
  }
  // A translation that is already on screen is only moved and turned after its text, so it does not flicker.
  function move(el, m) {
    var dx = (m.box[0] + m.box[2] - el.box[0] - el.box[2]) / 2 * 1920, dy = (m.box[1] + m.box[3] - el.box[1] - el.box[3]) / 2 * 1080;
    el.style.transform = 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px) rotate(' + (m.angle || 0) + 'deg)';
  }
  function similar(el, m) {
    var w0 = el.box[2] - el.box[0], h0 = el.box[3] - el.box[1], w = m.box[2] - m.box[0], h = m.box[3] - m.box[1];
    return el.rows === m.rows && Math.abs(w - w0) < 0.15 * w0 && Math.abs(h - h0) < 0.15 * h0;
  }
  function create(m) {
    var st = Object.assign({}, plain, m.style), el = document.createElement('div'), s = el.style;
    var x0 = m.box[0] * 1920, y0 = m.box[1] * 1080, w = (m.box[2] - m.box[0]) * 1920, h = (m.box[3] - m.box[1]) * 1080;
    // From the usual margin of 8 down to 0 the background shrinks from covering the original text to the translation alone.
    var px = st.padding, py = st.padding / 4, cover = Math.min(1, st.padding / 8), left, top;
    var fixed = st.size > 0, size = fixed ? st.size : m.line_height * 1080 * 0.74, min = fixed ? size : size * 0.7;
    var align = st.align === 'auto' ? (m.centered ? 'center' : 'left') : st.align;
    el.className = 'item';
    el.textContent = m.text;
    canvas.appendChild(el);
    s.transition = 'none';
    s.fontFamily = '"' + st.font + '", "Segoe UI", Arial, sans-serif';
    s.fontWeight = st.bold ? '700' : '400';
    s.fontStyle = st.italic ? 'italic' : 'normal';
    s.color = st.color;
    // The box comes in gradually: from nothing at 0 it reaches its full opacity at 4.
    s.background = rgba(st.background, st.opacity * Math.min(1, st.padding / 4));
    s.padding = py + 'px ' + px + 'px';
    s.minWidth = (cover * w + 2 * px) + 'px';
    s.minHeight = (cover * h + 2 * py) + 'px';
    s.textAlign = align;
    s.justifyContent = align === 'center' ? 'center' : align === 'right' ? 'flex-end' : 'flex-start';
    s.fontSize = size + 'px';
    if (m.rows > 1) {
      s.maxWidth = (w + 2 * px) + 'px';
      while (el.offsetHeight > h + 2 * py + 2 && size > min) s.fontSize = (size *= 0.94) + 'px';
    } else {
      s.whiteSpace = 'nowrap';
      while (el.offsetWidth > w + 2 * px + 1 && size > min) s.fontSize = (size *= 0.94) + 'px';
    }
    var shadows = (st.outline ? outline(st.outline, st.outline_color) : []).concat(st.shadow > 0 ? glow(st.shadow, st.background, st.shadow_strength) : []);
    s.textShadow = shadows.length ? shadows.join(', ') : 'none';
    left = align === 'center' ? x0 + w / 2 - el.offsetWidth / 2 : align === 'right' ? x0 + w + px - el.offsetWidth : x0 - px;
    left = Math.max(4, Math.min(1916 - el.offsetWidth, left));
    top = y0 + h / 2 - el.offsetHeight / 2;
    s.left = left + 'px';
    s.top = top + 'px';
    // The translation turns around the middle of the original text, so it lies the way the text lies in the picture.
    s.transformOrigin = (x0 + w / 2 - left) + 'px ' + (y0 + h / 2 - top) + 'px';
    el.box = m.box;
    el.rows = m.rows;
    move(el, m);
    void el.offsetWidth;
    s.transition = '';
    el.classList.add('on');
    return el;
  }
  function update(items) {
    var alive = {};
    items.forEach(function (m) {
      var look = JSON.stringify(m.style) + m.text, el = elements[m.id];
      alive[m.id] = 1;
      if (el && el.look === look && similar(el, m)) {
        move(el, m);
        return;
      }
      if (el) el.remove();
      elements[m.id] = create(m);
      elements[m.id].look = look;
    });
    Object.keys(elements).forEach(function (id) {
      if (alive[id]) return;
      var el = elements[id];
      delete elements[id];
      el.classList.remove('on');
      setTimeout(function () { el.remove(); }, 150);
    });
  }
  function connect() {
    var ws = new WebSocket(address);
    ws.onmessage = function (e) {
      update(JSON.parse(e.data).items.filter(function (m) { return (m.overlay || 0) === mine; }));
    };
    ws.onclose = function () { update([]); setTimeout(connect, 2000); };
  }
  connect();
})();
</script>
</body>
</html>
